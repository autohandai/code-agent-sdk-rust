[package]
name = "autohand-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Rust SDK for controlling Autohand code agents through the CLI JSON-RPC mode."
license = "Apache-2.0"
repository = "https://github.com/autohandai/code-agent-sdk-rust"
homepage = "https://autohand.ai/sdk/"
keywords = ["autohand", "agent", "sdk", "json-rpc", "cli-wrapper"]
categories = ["api-bindings", "development-tools"]

[lib]
name = "autohand_sdk"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "=2.0.19"
tokio = { version = "1.45", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "rustls-tls"] }
# These exact, optional constraints keep reqwest's transitive graph readable by
# Cargo 1.76 without enabling HTTP/3 or compiling unused QUIC dependencies.
hyper-rustls = { version = "=0.27.3", optional = true, default-features = false }
quinn = { version = "=0.11.6", optional = true, default-features = false }
quinn-proto = { version = "=0.11.9", optional = true, default-features = false }
quinn-udp = { version = "=0.5.7", optional = true, default-features = false }
url = "=2.5.2"
zeroize = { version = "=1.8.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.12"
